# Databricks Asset Bundle definition.
# Docs: https://docs.databricks.com/dev-tools/bundles/index.html
#
# Deploy:   databricks bundle deploy -t dev
# Run:      databricks bundle run <job_key> -t dev
bundle:
  name: databricks_experimentos

include:
  - resources/jobs/*.yml
  - resources/pipelines/*.yml
  - resources/clusters/*.yml
  - apps/*/app.yml

variables:
  catalog:
    description: Unity Catalog catalog used by this bundle.
    default: main
  schema:
    description: Default schema for the target environment.
    default: experimentos_dev
  warehouse_id:
    description: SQL warehouse used by dashboards and SQL tasks.
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: experimentos_dev

  staging:
    mode: production
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: experimentos_staging

  prod:
    mode: production
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      schema: experimentos_prod
    permissions:
      - level: CAN_VIEW
        group_name: users
